<style>:root{--marca:#0B5C7A;--marca-esc:#0B2F52;--grafite:#0B2F52;--bom:#17704A;--ruim:#C0392B;--tinta:#1E2328;--tinta2:#444D56;--tinta3:#5B6670;--grade:#E3E7EA;--fundo:#ECF1F5;--cartao:#fff;--foco:#1E2328;--dest:#8FDCE0;--ox:0px}
*{box-sizing:border-box}

button{cursor:pointer}

.grow{flex:1}

.vb{position:relative}

.plot-svg{display:block;font-family:inherit;max-width:100%}

.cv-rod{position:absolute;left:calc(24px + var(--ox,0px));top:1052px;margin:0;width:calc(1872px - var(--ox,0px));font-size:14px;color:var(--tinta3)}
.card-in{height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:8px 18px 6px;border-left:6px solid var(--marca);border-radius:10px}

.mtx{width:100%;border-collapse:collapse;font-size:16px}

.exp{min-width:36px;min-height:36px;border:1px solid #98A4AD;background:#fff;border-radius:6px;margin-right:6px}
.ok{color:var(--bom);font-weight:600}.nok{color:var(--ruim);font-weight:600}.neu{color:var(--tinta2);font-weight:600}
#tt{position:fixed;z-index:100;pointer-events:none;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.22);padding:10px 14px;min-width:200px;max-width:340px;font-size:14px}
.tt-d{margin:0}.tt-d div{display:flex;justify-content:space-between;gap:16px}.tt-d dt{color:var(--tinta2)}.tt-d dd{margin:0;font-weight:700}.tt-d .tt-h{font-weight:700;color:var(--tinta);margin-bottom:4px}
.tt-t{margin:0;font-weight:700;font-size:15px}.tt-s{margin:0 0 6px;color:var(--tinta3);font-size:13px}
.tt-g{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:6px 0}.tt-g span{display:block;font-size:11px;color:var(--tinta3)}.tt-f{margin:6px 0 0;font-size:13px;padding-top:6px;border-top:1px solid var(--grade)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#1E2328;color:#fff;padding:10px 18px;border-radius:8px;max-width:90vw}
.ctxmenu{position:fixed;z-index:110;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.22);padding:4px;min-width:260px;display:flex;flex-direction:column}
.ctxmenu button{text-align:left;min-height:42px;padding:8px 12px;border:0;background:none;border-radius:6px}
.ctxmenu button:hover,.ctxmenu button:focus{background:#E9ECF7}
.tview{position:absolute;left:var(--ox,0px);top:64px;width:calc(1920px - var(--ox,0px));height:1016px;background:#F4F6F7;z-index:20;padding:20px 32px 24px;overflow:auto}
.tv-bar{display:flex;align-items:center;gap:16px;margin-bottom:12px}.tv-bar h2{margin:0;font-size:22px}
.tv-vis{position:relative;height:430px;margin-bottom:12px}.tv-vis .vis{position:relative!important;left:0!important;top:0!important}
.tv-tab{background:#fff;border:1px solid var(--grade);border-radius:10px;padding:8px;max-height:480px;overflow:auto}
.painel{flex:none;width:430px;max-height:calc(100vh - 24px);position:sticky;top:12px;background:#fff;border:1px solid #98A4AD;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.pn-cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--grade);background:#EFF2F4}

.pn-x{min-height:40px;border:1px solid #98A4AD;background:#fff;border-radius:6px;padding:4px 12px}

.pn-corpo ul{margin:0;padding-left:20px}.pn-corpo li{margin:3px 0}
.dax{background:#1E2328;color:#E9ECF7;border-radius:6px;padding:10px;font:12.5px/1.45 Consolas,"SFMono-Regular",monospace;overflow:auto;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mdl{width:100%;border-collapse:collapse;font-size:13px}.mdl th,.mdl td{padding:5px 6px;border-bottom:1px solid var(--grade);text-align:left;vertical-align:top}
.pn-n{font-size:13px;color:var(--tinta2);margin:6px 0}
.docs a{color:var(--marca-esc);text-decoration:underline}
#modal .md-fundo{position:fixed;inset:0;background:rgba(20,35,43,.55);z-index:80}
#modal .md-cx{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:#fff;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.area.ph{display:block;padding:8px}
.phone{width:100%;max-width:390px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative}

.dbc{width:300px}.dbar{position:relative;height:28px;min-width:200px}.dbar i{position:absolute;left:0;top:2px;bottom:2px;background:#C9CFEA;border-radius:3px}.dbar span{position:relative;display:block;text-align:right;line-height:28px;padding-right:6px}

.grow{flex:1}

function escala() {
  const vp = document.getElementById('vp'), cv = document.getElementById('cv'), w = document.getElementById('cvw');

  const dim = typeof R.v.emit === 'function' ? R.v.emit(String(key)) : R.v.emit;
  S.sel[page] = cur && cur.vis === vis && String(cur.key) === String(key) ? null : { vis, dim, key: String(key) };

  abrirleit: () => { const H = CAPA_HIST(); S.capa = false; S.page = 1; if (H && H.f) S.f = { ...S.f, ...H.f }; },
  abrirbm: (el) => { S.capa = false; aplicarBM(el.dataset.bm); S.show = null; },
  leit: () => { const L = LEITURA(S.page); if (!L) return; if (L.bm) { aplicarBM(L.bm); S.show = null; } else if (L.f) { S.f = { ...S.f, ...L.f }; S.sel = {}; S.dd = { lvl: 0, key: null, mode: S.dd.mode }; S.show = null; } },
  pagina: (el) => irPagina(+el.dataset.pg),
  pop: (el) => { S.pop = S.pop === el.dataset.pop ? null : el.dataset.pop; },
  limpar: () => { S.f = {}; S.dd = { lvl: 0, key: null, mode: S.dd.mode }; S.sel = {}; S.pop = null; if (typeof LIMPAR_EXTRA === 'function') LIMPAR_EXTRA(); },
  reset: () => { Object.assign(S, PADRAO()); S.nums = false; S.view = innerWidth < 1600 ? 'width' : 'fit'; if (CFG.ficha && S.page === CFG.ficha) S.page = 1; S.dt = null; S.show = null; S.pop = null; },
  painel: () => { S.panel = !S.panel; S.pop = null; },
  nums: () => { S.nums = !S.nums; },
  view: (el) => { S.view = el.dataset.v; S.phone = false; S.pop = null; },
  phone: () => { S.phone = !S.phone; S.pop = null; },
  bm: (el) => { aplicarBM(el.dataset.bm); S.show = null; },
  show: () => { S.show = 0; aplicarBM(BOOKMARKS[0].id); },
  shownext: () => { if (S.show < BOOKMARKS.length - 1) { S.show++; aplicarBM(BOOKMARKS[S.show].id); } },
  showprev: () => { if (S.show > 0) { S.show--; aplicarBM(BOOKMARKS[S.show].id); } },
  showsair: () => { S.show = null; },
  mais: (el) => abrirMenu(el, el.dataset.vis, null),
  fechatabela: () => { S.table = null; },
  voltar: () => { irPagina(S.dt ? S.dt.from : CFG.fichaVolta); },
  dtbtn: () => { const r = DTBTN(); if (r) { drillthrough(r.dim, r.key); return 'feito'; } toast(CFG.dtDica); return 'feito'; },
  exp: (el) => { const r = +el.dataset.reg; if (S.mtx.has(r)) S.mtx.delete(r); else S.mtx.add(r); },
  mtxexp: () => { MTXEXP(); },
  mtxup: () => { MTXUP(); },
  drillup: () => { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); },
  drillmode: () => { S.dd.mode = !S.dd.mode; },
};
function executar(el, ev) {
  if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'dtbtn') return;
  const f = ACOES[el.dataset.act]; if (!f) return;
  const r = f(el, ev); if (r === 'feito') return;
  if (el.dataset.act !== 'pop') S.pop = null;
  render();
}

/* ---------- menus de contexto ---------- */
let MENU = null;
function abrirMenu(anchor, vis, key) {
  fecharMenu();
  const R = REGV[vis]; if (!R) return;
  const v = R.v, itens = [];
  if (key !== null && v.dt) itens.push([`Drill-through | ${CFG.dtNome}`, () => drillthrough(v.dt, key)]);
  if (CFG.dd && vis === CFG.dd.vis && key !== null) {
    if (S.dd.lvl === 0) itens.push([`Fazer drill down | abrir ${CFG.dd.down}`, () => { S.dd.lvl = 1; S.dd.key = numKey(key); limparDDSel(); render(); }]);
    else itens.push([`Fazer drill up | voltar para ${CFG.dd.up}`, () => { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); render(); }]);
  }
  if (!v.semTabela) itens.push(['Mostrar como tabela', () => { S.table = vis; esconderTip(); render(); setTimeout(() => { const b = document.querySelector('[data-act="fechatabela"]'); if (b) b.focus(); }, 0); }]);
  if (!itens.length) return;
  const m = document.createElement('div'); m.className = 'ctxmenu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'Opções do visual');
  m.innerHTML = itens.map((it, i) => `<button role="menuitem" tabindex="${i ? -1 : 0}" data-i="${i}">${esc(it[0])}</button>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const x = Math.min(window.innerWidth - 300, r.left + (key === null ? -200 : r.width / 2)), y = Math.min(window.innerHeight - m.offsetHeight - 8, r.bottom + 4);
  m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
  MENU = { m, itens, anchor: sig(anchor) };
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const f = itens[+b.dataset.i][1]; fecharMenu(false); f(); });
  m.addEventListener('keydown', (e) => {
    const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length]; n.focus(); }
    if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); fecharMenu(true); }
  });
  esconderTip();
  m.querySelector('button').focus();
}
function fecharMenu(devolver) {
  if (!MENU) return; const a = MENU.anchor; MENU.m.remove(); MENU = null;
  if (devolver) restaurar({ s: a });
}

/* ---------- dica de ferramenta ---------- */
const TT = () => document.getElementById('tt');
function tipHTML(vis, key) {
  const R = REGV[vis]; if (!R) return '';
  const { v, c } = R;
  const F = c.F;
  if (v.tip && TIPS[v.tip]) return TIPS[v.tip](F, key, c);
  if (v.dtip) return dicaPadrao(v.dtip(c, key));
  const lab = document.querySelector(`[data-pt="${vis}|${key}"]`); return lab ? dicaPadrao([[lab.getAttribute('aria-label'), '']]) : '';
}
const dicaPadrao = (rows) => `<dl class="tt-d">${rows.map(([a, b]) => (b === '' ? `<dt class="tt-h">${esc(a)}</dt>` : `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`)).join('')}</dl>`;
function mostrarTip(el, ev) {
  const [vis, key] = el.dataset.pt.split('|'); const html = tipHTML(vis, key); if (!html) return;
  const t = TT(); t.innerHTML = html; t.hidden = false; t.classList.toggle('pg', html.indexOf('tt-t') >= 0);
  posTip(ev, el);
}
function posTip(ev, el) {
  const t = TT(); if (t.hidden) return;
  let x, y;
  if (ev && ev.clientX !== undefined && ev.type !== 'focusin') { x = ev.clientX + 16; y = ev.clientY + 16; } else { const r = el.getBoundingClientRect(); x = r.right + 8; y = r.top; }
  const w = t.offsetWidth, h = t.offsetHeight;
  if (x + w > window.innerWidth - 8) x = Math.max(8, (ev && ev.clientX ? ev.clientX : x) - w - 16);
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function esconderTip() { const t = TT(); if (t) t.hidden = true; }
let TOASTT = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(TOASTT); TOASTT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  if (MENU && !e.target.closest('.ctxmenu')) fecharMenu(false);
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); executar(a, e); return; }
  const p = e.target.closest('[data-pt]');
  if (p) { const [vis, key] = p.dataset.pt.split('|'); selecionar(vis, key); return; }
  const plot = e.target.closest('[data-plot]');
  if (plot) { if (S.pop && !e.target.closest('.ddpop, .tbpop')) { S.pop = null; render(); return; } const vis = plot.dataset.plot; if (S.sel[S.page] && S.sel[S.page].vis === vis) { S.sel[S.page] = null; render(); } return; }
  if (S.pop && !e.target.closest('.ddpop, .tbpop')) { S.pop = null; render(); }
});
function ajustaDD() { if (CFG.dd && S.dd.lvl === 1 && !DD_OK()) { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); } }
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const k = el.dataset.chg;
  if (k === 'perfil' || k === 'perfilcapa') { S.perfil = el.value; Object.assign(S, PADRAO()); S.dt = null; if (CFG.ficha && S.page === CFG.ficha) S.page = CFG.fichaVolta; }
  else if (k.startsWith('all-f:')) { S.f[k.slice(6)] = null; ajustaDD(); }
  else if (k.startsWith('f:')) { const d = DIMS.find((x) => x.id === k.slice(2)); const all = dimVals(d).map((x) => x.id); const v = +el.value; const cur = S.f[d.id] ? new Set(S.f[d.id]) : new Set(all); if (el.checked) cur.add(v); else cur.delete(v); S.f[d.id] = all.every((x) => cur.has(x)) || !cur.size ? null : cur; for (const e2 of DIMS) if (e2.dep === d.id && S.f[e2.id]) { const ok2 = new Set(dimVals(e2).map((x) => x.id)); const n2 = new Set([...S.f[e2.id]].filter((x) => ok2.has(x))); S.f[e2.id] = n2.size ? n2 : null; } ajustaDD(); }
  render();
});
document.addEventListener('contextmenu', (e) => {
  const p = e.target.closest('[data-pt]'); if (!p) return;
  e.preventDefault(); const [vis, key] = p.dataset.pt.split('|'); abrirMenu(p, vis, key);
});
document.addEventListener('keydown', (e) => {
  const el = document.activeElement;
  if (e.key === 'Escape') {
    if (MENU) { fecharMenu(true); return; }
    if (S.pop) { const p = S.pop; S.pop = null; render(); restaurar({ s: sig({ dataset: { act: 'pop', pop: p } }) }); return; }
    if (!TT().hidden) { esconderTip(); return; }
    if (S.panel && !painelLateral()) { S.panel = false; render(); return; }
    if (S.table) { const v = S.table; S.table = null; render(); const b = document.querySelector(`[data-act="mais"][data-vis="${v}"]`); if (b) b.focus(); return; }
  }
  if (el && el.dataset && el.dataset.pt) {
    const [vis] = el.dataset.pt.split('|');
    if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      e.preventDefault();
      const pts = [...document.querySelectorAll(`[data-pt^="${vis}|"]`)]; const i = pts.indexOf(el);
      let n = e.key === 'Home' ? 0 : e.key === 'End' ? pts.length - 1 : i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1);
      n = Math.max(0, Math.min(pts.length - 1, n));
      pts.forEach((p) => p.setAttribute('tabindex', '-1')); pts[n].setAttribute('tabindex', '0'); pts[n].focus();
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const [v, k] = el.dataset.pt.split('|'); selecionar(v, k); return; }
    if (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey)) { e.preventDefault(); const [v, k] = el.dataset.pt.split('|'); abrirMenu(el, v, k); return; }
  }
  if (e.key === 'Tab' && S.panel && !painelLateral()) { // foco preso no diálogo
    const md = document.querySelector('.md-cx'); if (!md) return;
    const f = [...md.querySelectorAll('button, a, [tabindex="0"]')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('mouseover', (e) => { const p = e.target.closest('[data-pt]'); if (p && !MENU) mostrarTip(p, e); });
document.addEventListener('mousemove', (e) => { const p = e.target.closest('[data-pt]'); if (p) posTip(e, p); else esconderTip(); });
document.addEventListener('focusin', (e) => { const p = e.target.closest && e.target.closest('[data-pt]'); if (p && !MENU) mostrarTip(p, { type: 'focusin' }); else if (!e.target.closest || !e.target.closest('#tt')) esconderTip(); });
let RZ = null, ULTFONE = null;
window.addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(() => { const f = isPhone(); if (f !== ULTFONE || !document.getElementById('vp')) { ULTFONE = f; render(); } else escala(); }, 80); });
ULTFONE = isPhone();
render();
</script>
</body>
