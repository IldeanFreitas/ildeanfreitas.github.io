<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel de agenda e retorno da rede de clínicas | Mockup interativo</title>
<style>:root{--marca:#7E3A87;--marca-esc:#5C2A66;--grafite:#3B1E40;--bom:#17704A;--ruim:#C0392B;--tinta:#1E2328;--tinta2:#444D56;--tinta3:#5B6670;--grade:#E3E7EA;--fundo:#F3EFF4;--cartao:#fff;--foco:#1E2328;--dest:#7FD6CB;--ox:0px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--tinta);background:var(--fundo);font-size:15px;line-height:1.4;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:3px}
.pt:focus-visible{outline:3px solid var(--foco);outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{min-height:calc(100vh - 30px)}
#app[inert]{pointer-events:none}
#faixa{background:#1E2328;color:#fff;font-size:13px;padding:5px 12px;text-align:center;letter-spacing:.2px}
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--grade);flex-wrap:wrap}
.b-esq{display:flex;align-items:center;gap:10px}
.b-esq h1{font-size:16px;margin:0}
.b-esq p{margin:0;font-size:12px;color:var(--tinta3)}
.b-dir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;background:var(--marca);color:#fff;font-weight:700;font-size:18px}
.tb,.prim,.sec,.btn-limpa,.btn-dt,.btn-back{min-height:40px;padding:6px 14px;border:1px solid #98A4AD;background:#fff;border-radius:6px;font-weight:600;color:var(--tinta)}
.tb:hover,.sec:hover,.btn-limpa:hover,.btn-dt:hover,.btn-back:hover{background:#E9ECF7}
.prim,.tb.prim{background:var(--marca-esc);border-color:var(--marca-esc);color:#fff}
.prim:hover,.tb.prim:hover{background:#222C66}
.pw{position:relative}
.tbpop{position:absolute;right:0;top:44px;z-index:30;min-width:240px;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.18);padding:6px;display:flex;flex-direction:column}
.tbpop button{text-align:left;border:0;background:none;padding:10px 12px;min-height:40px;border-radius:6px}
.tbpop button:hover{background:#E9ECF7}
.tbpop button[aria-checked="true"]::before{content:"\2713\00a0"}
.tbpop.ind{min-width:320px}
.tbpop.ind button{display:flex;flex-direction:column;gap:2px}
.tbpop.ind span{font-size:12px;color:var(--tinta3);font-weight:400}
.pop-t{margin:6px 12px;font-weight:700;font-size:13px;color:var(--tinta3)}
.tbpop .prim{margin-top:6px;text-align:center;color:#fff}
.vercomo{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.vercomo select{min-height:40px;border:1px solid #98A4AD;border-radius:6px;padding:4px 8px;background:#fff}
.faixa-rls,.faixa-show{margin:0;padding:6px 16px;font-size:14px;background:#FFF3DC;border-bottom:1px solid #EBCB8B;color:#5A3A00}
.faixa-show{background:#E1E5F4;border-color:#B8C0E4;color:#1B2352;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.faixa-show button{min-height:36px;padding:2px 12px;border:1px solid #98A4AD;border-radius:6px;background:#fff}
button[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.capa{display:grid;place-items:center;min-height:calc(100vh - 60px);padding:24px}
.capa-in{max-width:820px;background:#fff;border-radius:12px;padding:36px;box-shadow:0 6px 28px rgba(20,35,43,.1);border-top:6px solid var(--marca)}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#7A5200}
.capa h1{font-size:30px;line-height:1.15;margin:0 0 12px}
.lead{font-size:17px;color:var(--tinta2);margin:0 0 20px}
.perfis{border:1px solid var(--grade);border-radius:8px;padding:10px 14px;margin:0 0 20px}
.perfis legend{font-weight:700;font-size:13px;padding:0 6px;color:var(--tinta2)}
.pf{display:grid;grid-template-columns:24px 1fr;column-gap:8px;padding:8px;border-radius:6px;cursor:pointer;min-height:44px;align-items:center}
.pf input{grid-row:1/3;width:20px;height:20px;accent-color:var(--marca-esc)}
.pf span{grid-column:2;font-size:13px;color:var(--tinta3)}
.pf.on{background:#E1E5F4}
.capa-bt{display:flex;gap:10px;flex-wrap:wrap}
.capa-bt .prim,.capa-bt .sec{padding:10px 20px}
.nota{font-size:13px;color:var(--tinta3);margin:18px 0 0}
.area{display:flex;align-items:flex-start;gap:12px;padding:12px}
.vp{flex:1;min-width:0}
.vp.width,.vp.real{overflow:auto}
.cv-wrap{margin:0 auto;position:relative}
.canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#F4F6F7;border:0;overflow:hidden}
.cv-top{position:absolute;left:0;top:0;width:1920px;height:64px;background:var(--grafite);color:#fff;display:flex;align-items:center;gap:36px;padding:0 24px}
.cv-brand{display:flex;align-items:center;gap:12px;font-size:24px}
.cv-brand small{display:block;font-size:13px;font-weight:400;color:var(--tinta3);line-height:1.2}
.cv-top .cv-brand{padding:0;white-space:nowrap}.cv-top .cv-brand small{color:#C9D1D8}.cv-top .logo{background:#fff;color:var(--grafite)}
.cv-brand .logo{width:40px;height:40px;font-size:22px}
.cv-brand b{font-weight:700}
.pnav{display:flex;gap:4px;flex:1}
.pnav.topo{flex:1;gap:6px;align-items:stretch;height:64px}
.pnav.topo .pg{min-height:64px;padding:0 24px;border:0;border-bottom:6px solid transparent;color:#E6EBEF;font-size:20px;line-height:1.2}
.pnav.topo .pg:hover{background:#3A4149}
.pnav.topo .pg.on{background:#3A4149;border-bottom-color:#E0B03A;color:#fff}
.pg{min-height:48px;padding:8px 22px;border:0;border-bottom:4px solid transparent;background:none;font-size:20px;font-weight:600;color:var(--tinta2)}
.pg:hover{background:#E9ECF7}
.pg.on{color:var(--tinta)}
.cv-data{font-size:14px;color:#C9D1D8;margin:0;text-align:right;line-height:1.4;white-space:nowrap}
.cv-slic{position:absolute;left:calc(24px + var(--ox,0px));top:72px;width:calc(1872px - var(--ox,0px));height:64px;display:flex;align-items:flex-end;gap:20px}
.slicer{display:flex;flex-direction:column;gap:2px;position:relative}
.sl-lab,.bs-lab{font-size:14px;font-weight:700;color:var(--tinta2)}
.sl-lab small{font-weight:400}
.bslicer{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bs{min-height:44px;padding:6px 16px;border:1px solid #98A4AD;background:#fff;border-radius:6px;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.bs.on{background:var(--marca-esc);border-color:var(--marca-esc);color:#fff}
.bs:hover:not(.on){background:#E9ECF7}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 0 1px #56687A}
.dd{min-height:44px;min-width:170px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;border:1px solid #98A4AD;background:#fff;border-radius:6px;font-size:16px}
.ddpop{position:absolute;top:70px;left:0;z-index:40;min-width:220px;max-height:340px;overflow:auto;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.2);padding:6px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:40px;border-radius:6px;cursor:pointer}
.chk:hover{background:#E9ECF7}
.chk input{width:20px;height:20px;accent-color:var(--marca-esc)}
.grow{flex:1}
.btn-dt{background:var(--marca-esc);border-color:var(--marca-esc);color:#fff;font-size:16px}
.btn-dt:hover{background:#222C66}
.btn-dt[aria-disabled="true"]{background:#fff;color:var(--tinta3);border-color:#98A4AD}
.dt-tit{margin:0;font-size:22px}
.dt-tit span{font-size:16px;color:var(--tinta3);font-weight:400}
.btn-back{display:inline-flex;align-items:center;gap:6px}
.vis{position:absolute;background:var(--cartao);border:1px solid var(--grade);border-radius:10px;padding:12px 14px;overflow:hidden}
.vis.t-card,.vis.t-parametro{padding:0}
.vh{display:flex;justify-content:space-between;gap:10px;min-height:54px}
.vh-t{min-width:0}
.vt{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.vs{margin:2px 0 0;font-size:14px;color:var(--tinta3)}
.vic{display:flex;gap:2px;flex:none;align-items:flex-start}
.ic{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--tinta2)}
.ic:hover{background:#E9ECF7}
.ic.on{background:var(--marca-esc);color:#fff}
.vb{position:relative}
.vb.rola{overflow:auto}
.plot-svg{display:block;font-family:inherit;max-width:100%}
.pt{cursor:pointer}
.pt.is-sel rect:not(.band){stroke:var(--tinta);stroke-width:2}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--tinta2);margin:0 0 6px;padding:0;list-style:none;min-height:24px;align-items:center}
.leg li{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px}
.leg i.dash{width:22px;height:0;border-top:3px dashed;border-radius:0;background:none!important}
.num{position:absolute;left:6px;top:6px;z-index:5;background:#7A5200;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:14px}
.cv-rod{position:absolute;left:calc(24px + var(--ox,0px));top:1052px;margin:0;width:calc(1872px - var(--ox,0px));font-size:14px;color:var(--tinta3)}
.card-in{height:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:8px 18px 6px;border-left:6px solid var(--marca);border-radius:10px}
.c-lab{margin:0;font-size:15px;font-weight:700;color:var(--tinta2);text-transform:uppercase;letter-spacing:.4px}
.c-val{margin:2px 0;font-size:38px;line-height:1.1;font-weight:700}
.c-sub{margin:0;font-size:14px;color:var(--tinta2)}
.pos{color:var(--bom);font-weight:600}.neg{color:var(--ruim);font-weight:600}.neu{color:var(--tinta3)}
.vazio{margin:20px;color:var(--tinta3)}
.mtx{width:100%;border-collapse:collapse;font-size:16px}
.mtx th,.mtx td{padding:8px 10px;border-bottom:1px solid var(--grade);text-align:right;white-space:nowrap}
.mtx th:first-child,.mtx td:first-child{text-align:left}
.mtx thead th{position:sticky;top:0;background:#EFF2F4;font-size:14px;color:var(--tinta2);z-index:1}
.mtx tbody th{font-weight:400}
.mtx tr.n1 th{padding-left:34px}
.mtx tr.n0 th{font-weight:700}
.mtx tr.is-sel{background:#FFF3DC;box-shadow:inset 4px 0 0 var(--grafite)}
.mtx tr.dim{opacity:.5}
.mtx [data-pt]{cursor:pointer}
.mtx tr:hover{background:#F4F5FB}
.exp{min-width:36px;min-height:36px;border:1px solid #98A4AD;background:#fff;border-radius:6px;margin-right:6px}
.ok{color:var(--bom);font-weight:600}.nok{color:var(--ruim);font-weight:600}.neu{color:var(--tinta2);font-weight:600}
#tt{position:fixed;z-index:100;pointer-events:none;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.22);padding:10px 14px;min-width:200px;max-width:340px;font-size:14px}
.tt-d{margin:0}.tt-d div{display:flex;justify-content:space-between;gap:16px}.tt-d dt{color:var(--tinta2)}.tt-d dd{margin:0;font-weight:700}.tt-d .tt-h{font-weight:700;color:var(--tinta);margin-bottom:4px}
.tt-t{margin:0;font-weight:700;font-size:15px}.tt-s{margin:0 0 6px;color:var(--tinta3);font-size:13px}
.tt-g{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:6px 0}.tt-g span{display:block;font-size:11px;color:var(--tinta3)}.tt-f{margin:6px 0 0;font-size:13px;padding-top:6px;border-top:1px solid var(--grade)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:#1E2328;color:#fff;padding:10px 18px;border-radius:8px;max-width:90vw}
.ctxmenu{position:fixed;z-index:110;background:#fff;border:1px solid #98A4AD;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,43,.22);padding:4px;min-width:260px;display:flex;flex-direction:column}
.ctxmenu button{text-align:left;min-height:42px;padding:8px 12px;border:0;background:none;border-radius:6px}
.ctxmenu button:hover,.ctxmenu button:focus{background:#E9ECF7}
.tview{position:absolute;left:var(--ox,0px);top:64px;width:calc(1920px - var(--ox,0px));height:1016px;background:#F4F6F7;z-index:20;padding:20px 32px 24px;overflow:auto}
.tv-bar{display:flex;align-items:center;gap:16px;margin-bottom:12px}.tv-bar h2{margin:0;font-size:22px}
.tv-vis{position:relative;height:430px;margin-bottom:12px}.tv-vis .vis{position:relative!important;left:0!important;top:0!important}
.tv-tab{background:#fff;border:1px solid var(--grade);border-radius:10px;padding:8px;max-height:480px;overflow:auto}
.painel{flex:none;width:430px;max-height:calc(100vh - 24px);position:sticky;top:12px;background:#fff;border:1px solid #98A4AD;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.pn-cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--grade);background:#EFF2F4}
.pn-cab h2{margin:0;font-size:20px}
.pn-x{min-height:40px;border:1px solid #98A4AD;background:#fff;border-radius:6px;padding:4px 12px}
.pn-corpo{overflow:auto;padding:4px 16px 16px;font-size:14px}
.pn-corpo h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--marca-esc);margin:16px 0 4px}
.pn-corpo ul{margin:0;padding-left:20px}.pn-corpo li{margin:3px 0}
.dax{background:#1E2328;color:#E9ECF7;border-radius:6px;padding:10px;font:12.5px/1.45 Consolas,"SFMono-Regular",monospace;overflow:auto;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mdl{width:100%;border-collapse:collapse;font-size:13px}.mdl th,.mdl td{padding:5px 6px;border-bottom:1px solid var(--grade);text-align:left;vertical-align:top}
.pn-n{font-size:13px;color:var(--tinta2);margin:6px 0}
.docs a{color:var(--marca-esc);text-decoration:underline}
#modal .md-fundo{position:fixed;inset:0;background:rgba(20,35,43,.55);z-index:80}
#modal .md-cx{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:#fff;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.area.ph{display:block;padding:8px}
.phone{width:100%;max-width:390px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative}
.phone.moldura{border:10px solid #1E2328;border-radius:28px;padding:10px;background:#F4F6F7}
.phone .vis{position:relative}
.ph-top .cv-brand{font-size:18px;margin-bottom:6px}.ph-top .cv-brand .logo{width:32px;height:32px;font-size:18px}
.ph-top .pnav{overflow-x:auto;flex:none}.ph-top .pg{font-size:15px;padding:6px 12px;white-space:nowrap;border-bottom-color:transparent}
.ph-top .pg.on{border-bottom:4px solid var(--grafite)}
.ph-nota{font-size:12px;color:var(--tinta3);margin:0}
.ph-slic{position:static;width:auto;height:auto;flex-wrap:wrap;align-items:flex-start;gap:10px}
.phone .vt{font-size:16px}.phone .c-val{font-size:30px}.phone .dt-tit{font-size:18px;flex-basis:100%}
.phone .tview{position:static;width:auto;height:auto;padding:0}.phone .tv-tab{max-height:none}.phone .mtx{font-size:14px}
.phone .vb.rola,.phone .vb{overflow:auto}
.phone .ddpop{top:62px}
@media (max-width:759px){.ph-top .pnav{overflow:visible;width:100%}.ph-top .pg{font-size:12.5px;padding:6px 4px;white-space:normal;flex:1;text-align:center;line-height:1.2}.barra{padding:8px}.bs{padding:6px 10px;font-size:15px}.b-esq p{display:none}.capa-in{padding:20px}.capa h1{font-size:24px}.tbpop{right:auto;left:0}.tbpop.ind{min-width:min(320px,90vw)}.mtx th,.mtx td{padding:6px}.ddpop{max-width:90vw}}
@media (max-width:1499px){.painel{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (forced-colors:active){.pt.is-sel rect{stroke:Highlight}.bs.on{outline:2px solid Highlight}}

.dbc{width:300px}.dbar{position:relative;height:28px;min-width:200px}.dbar i{position:absolute;left:0;top:2px;bottom:2px;background:#C9CFEA;border-radius:3px}.dbar span{position:relative;display:block;text-align:right;line-height:28px;padding-right:6px}
.mtx tfoot th,.mtx tfoot td{font-weight:700;border-top:2px solid var(--grafite);background:#EFF2F4}
.mtx tfoot th{text-align:left}
.leg i.dash{border-color:var(--grafite)}
.mtx .tl{text-align:left}

.grow{flex:1}
/* navegação: trilho de ícones, menu lateral, abas e navegador de indicadores */
.pnav.lado{position:absolute;left:0;top:64px;height:1016px;background:var(--grafite);display:flex;flex-direction:column;gap:6px;padding:12px 0;flex:none}
.pnav.nav-trilho{width:var(--ox,72px);align-items:stretch}
.pnav.nav-trilho .pg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;min-height:68px;border:0;border-left:5px solid transparent;color:#DDE3F5;background:none;font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
.pnav.nav-trilho .pg.on{background:rgba(255,255,255,.14);border-left-color:var(--dest);color:#fff}
.pnav.nav-trilho .pg:hover{background:rgba(255,255,255,.1)}
.pnav.nav-lateral{width:240px;align-items:stretch}
.pnav.nav-lateral .pg{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:56px;border:0;border-left:6px solid transparent;color:#E6EBEF;background:none;font-size:19px;font-weight:600;text-align:left}
.pnav.nav-lateral .pg.on{background:rgba(255,255,255,.14);border-left-color:var(--dest);color:#fff}
.pnav.nav-lateral .pg:hover{background:rgba(255,255,255,.1)}
.pnav.topo.nav-abas .pg{border-radius:10px 10px 0 0;margin-top:10px;min-height:54px;background:rgba(255,255,255,.08)}
.pnav.topo.nav-abas .pg.on{background:var(--fundo);color:var(--tinta);border-bottom-color:transparent}
.pnav.topo.nav-indicadores .pg{margin:10px 0;min-height:44px;border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:0 20px;font-size:18px}
.pnav.topo.nav-indicadores .pg.on{background:#fff;color:var(--grafite);border-color:#fff}
.pnav.topo .pg.on{border-bottom-color:var(--dest)}
.pnav.lado .pg svg{flex:none}

.matriz{table-layout:fixed}.matriz th.tl{width:150px;text-align:left}.matriz td.mz,.matriz thead th{text-align:center}.matriz td.mz{height:54px;font-weight:600;border-left:1px solid #fff}.mz-b{background:#EEF0F4;color:var(--tinta)}.mz-m{background:#F3E4BE;color:var(--tinta)}.mz-g{background:#E9B9B1;color:var(--tinta)}

.ph-top .pnav{width:100%!important;position:static;height:auto;background:var(--grafite);flex-direction:row!important;padding:4px 0}.ph-top .pnav .pg{flex-direction:column;min-height:56px;color:#fff!important;font-size:12.5px!important;border-left:0!important;border-bottom:4px solid transparent!important}.ph-top .pnav .pg.on{background:rgba(255,255,255,.18)!important;border-bottom-color:var(--dest)!important}.ph-top .pnav .pg svg{width:22px;height:22px}
.vb.rola:has(.matriz){overflow:auto}
.phone .matriz th.tl{width:56px}.phone .matriz td.mz{height:34px}.phone .vb:has(.matriz){height:auto!important}

/* Barras horizontais agrupadas (duas medidas na mesma unidade e escala). items: {k,label,a,b,alab,blab} */
function cluster(o) {

    s += T(lw - 10, y + rowH / 2 + fs * 0.35, d.label, { a: 'end', c: COR.tinta, fs: fitFs(d.label, fs, lw - 14) });

      const v = d[k]; if (nul(v)) { s += T(lw + pad, yy + bh - 4, ND, { c: COR.tinta3, fs: fs - 1 }); return; }
      const bw = Math.max(0, sx(v) - (lw + pad));

    });
    s += '</g>';
  });
  return s + '</svg>';
}

  });
  return s + '</svg>';

  if (typeof MEDIDAS !== 'object' || !VISUAIS[p]) return '';
  let cards = {}; try { cards = cardsDe(baseF(p)); } catch (e) { cards = {}; }
  const L = []; const vistos = new Set();

  app.innerHTML = S.capa ? capaHTML() + painelAside() : relatorioHTML();
  const md = document.getElementById('modal');
  md.innerHTML = S.panel && !painelLateral() ? `<div class="md-fundo" data-act="painel"></div><div class="md-cx" role="dialog" aria-modal="true" aria-labelledby="pn-h">${comoSeriaHTML(S.capa ? 0 : S.page)}</div>` : '';
  const modal = !!md.innerHTML;
  ['app', 'faixa'].forEach((id) => { const el = document.getElementById(id); if (el) el.inert = modal; });
  escala();
  document.querySelectorAll('.vb.rola').forEach((e) => e.classList.toggle('tem-mais', e.scrollHeight > e.clientHeight + 2)); /* aviso de rolagem em tabelas que não cabem */
  if (modal && !modalAnterior) { const f = md.querySelector('button, a, [tabindex]'); if (f) f.focus(); modalAnterior = foco || { s: 'painel' }; return; }
  if (!modal && modalAnterior) { const ant = modalAnterior; modalAnterior = null; if (restaurar(ant)) return; }
  if (foco) restaurar(foco);
}
function restaurar(f) {
  if (!f) return false;
  let el = null;
  if (f.id) el = document.getElementById(f.id);
  else if (f.s === 'painel') el = document.querySelector('[data-act="painel"]');
  else el = [...document.querySelectorAll('[data-act],[data-pt],[data-chg]')].find((e) => sig(e) === f.s && (f.v === undefined || e.value === f.v || e.type !== 'checkbox'));
  if (el) { if (el.dataset.pt) { const g = el.closest('svg, table'); if (g) g.querySelectorAll('[data-pt]').forEach((p) => p.setAttribute('tabindex', '-1')); el.setAttribute('tabindex', '0'); } el.focus({ preventScroll: true }); return true; }
  const h = document.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  return false;
}
function escala() {
  const vp = document.getElementById('vp'), cv = document.getElementById('cv'), w = document.getElementById('cvw');
  if (!vp || !cv) return;
  const r = vp.getBoundingClientRect();
  const aw = Math.max(200, vp.clientWidth - 24), ah = Math.max(200, window.innerHeight - r.top - 16);
  let s = S.view === 'real' ? 1 : S.view === 'width' ? aw / 1920 : Math.min(aw / 1920, ah / 1080);
  s = Math.max(0.2, s);
  cv.style.transform = `scale(${s})`; w.style.width = 1920 * s + 'px'; w.style.height = 1080 * s + 'px';
  window.__escala = s;
}

/* ---------- ações ---------- */
function irPagina(p) { S.page = p; S.table = null; S.pop = null; }
function aplicarBM(id) { const b = BOOKMARKS.find((x) => x.id === id); Object.assign(S, PADRAO(), b.st()); S.dt = null; S.table = null; S.pop = null; }
function selecionar(vis, key) {
  const R = REGV[vis]; if (!R || !R.v.emit || R.v.semSel) return;
  const page = S.page;
  if (CFG.dd && vis === CFG.dd.vis && S.dd.mode && S.dd.lvl === 0) { S.dd.lvl = 1; S.dd.key = numKey(key); limparDDSel(); render(); return; }
  const cur = S.sel[page];
  const dim = typeof R.v.emit === 'function' ? R.v.emit(String(key)) : R.v.emit;
  S.sel[page] = cur && cur.vis === vis && String(cur.key) === String(key) ? null : { vis, dim, key: String(key) };
  render();
}
function drillthrough(dim, key) { S.dt = { dim, key: numKey(key), from: S.page }; S.page = CFG.ficha; S.sel[CFG.ficha] = null; S.table = null; esconderTip(); render(); }
function limparDDSel() { if (CFG.dd && S.sel[CFG.dd.pagina] && S.sel[CFG.dd.pagina].vis === CFG.dd.vis) S.sel[CFG.dd.pagina] = null; }
const ACOES = {
  chipx: (el) => { const f = { ...S.f }; delete f[el.dataset.dim]; S.f = f; S.sel = {}; },
  chipsel: () => { S.sel[S.page] = null; },
  abrir: () => { S.capa = false; S.page = 1; },
  abrirleit: () => { const H = CAPA_HIST(); S.capa = false; S.page = 1; if (H && H.f) S.f = { ...S.f, ...H.f }; },
  abrirbm: (el) => { S.capa = false; aplicarBM(el.dataset.bm); S.show = null; },
  leit: () => { const L = LEITURA(S.page); if (!L) return; if (L.bm) { aplicarBM(L.bm); S.show = null; } else if (L.f) { S.f = { ...S.f, ...L.f }; S.sel = {}; S.dd = { lvl: 0, key: null, mode: S.dd.mode }; S.show = null; } },
  pagina: (el) => irPagina(+el.dataset.pg),
  pop: (el) => { S.pop = S.pop === el.dataset.pop ? null : el.dataset.pop; },
  limpar: () => { S.f = {}; S.dd = { lvl: 0, key: null, mode: S.dd.mode }; S.sel = {}; S.pop = null; if (typeof LIMPAR_EXTRA === 'function') LIMPAR_EXTRA(); },
  reset: () => { Object.assign(S, PADRAO()); S.nums = false; S.view = innerWidth < 1600 ? 'width' : 'fit'; if (CFG.ficha && S.page === CFG.ficha) S.page = 1; S.dt = null; S.show = null; S.pop = null; },
  painel: () => { S.panel = !S.panel; S.pop = null; },
  nums: () => { S.nums = !S.nums; },
  view: (el) => { S.view = el.dataset.v; S.phone = false; S.pop = null; },
  phone: () => { S.phone = !S.phone; S.pop = null; },
  bm: (el) => { aplicarBM(el.dataset.bm); S.show = null; },
  show: () => { S.show = 0; aplicarBM(BOOKMARKS[0].id); },
  shownext: () => { if (S.show < BOOKMARKS.length - 1) { S.show++; aplicarBM(BOOKMARKS[S.show].id); } },
  showprev: () => { if (S.show > 0) { S.show--; aplicarBM(BOOKMARKS[S.show].id); } },
  showsair: () => { S.show = null; },
  mais: (el) => abrirMenu(el, el.dataset.vis, null),
  fechatabela: () => { S.table = null; },
  voltar: () => { irPagina(S.dt ? S.dt.from : CFG.fichaVolta); },
  dtbtn: () => { const r = DTBTN(); if (r) { drillthrough(r.dim, r.key); return 'feito'; } toast(CFG.dtDica); return 'feito'; },
  exp: (el) => { const r = +el.dataset.reg; if (S.mtx.has(r)) S.mtx.delete(r); else S.mtx.add(r); },
  mtxexp: () => { MTXEXP(); },
  mtxup: () => { MTXUP(); },
  drillup: () => { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); },
  drillmode: () => { S.dd.mode = !S.dd.mode; },
};
function executar(el, ev) {
  if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'dtbtn') return;
  const f = ACOES[el.dataset.act]; if (!f) return;
  const r = f(el, ev); if (r === 'feito') return;
  if (el.dataset.act !== 'pop') S.pop = null;
  render();
}

/* ---------- menus de contexto ---------- */
let MENU = null;
function abrirMenu(anchor, vis, key) {
  fecharMenu();
  const R = REGV[vis]; if (!R) return;
  const v = R.v, itens = [];
  if (key !== null && v.dt) itens.push([`Drill-through | ${CFG.dtNome}`, () => drillthrough(v.dt, key)]);
  if (CFG.dd && vis === CFG.dd.vis && key !== null) {
    if (S.dd.lvl === 0) itens.push([`Fazer drill down | abrir ${CFG.dd.down}`, () => { S.dd.lvl = 1; S.dd.key = numKey(key); limparDDSel(); render(); }]);
    else itens.push([`Fazer drill up | voltar para ${CFG.dd.up}`, () => { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); render(); }]);
  }
  if (!v.semTabela) itens.push(['Mostrar como tabela', () => { S.table = vis; esconderTip(); render(); setTimeout(() => { const b = document.querySelector('[data-act="fechatabela"]'); if (b) b.focus(); }, 0); }]);
  if (!itens.length) return;
  const m = document.createElement('div'); m.className = 'ctxmenu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', 'Opções do visual');
  m.innerHTML = itens.map((it, i) => `<button role="menuitem" tabindex="${i ? -1 : 0}" data-i="${i}">${esc(it[0])}</button>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const x = Math.min(window.innerWidth - 300, r.left + (key === null ? -200 : r.width / 2)), y = Math.min(window.innerHeight - m.offsetHeight - 8, r.bottom + 4);
  m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
  MENU = { m, itens, anchor: sig(anchor) };
  m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; const f = itens[+b.dataset.i][1]; fecharMenu(false); f(); });
  m.addEventListener('keydown', (e) => {
    const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length]; n.focus(); }
    if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); fecharMenu(true); }
  });
  esconderTip();
  m.querySelector('button').focus();
}
function fecharMenu(devolver) {
  if (!MENU) return; const a = MENU.anchor; MENU.m.remove(); MENU = null;
  if (devolver) restaurar({ s: a });
}

/* ---------- dica de ferramenta ---------- */
const TT = () => document.getElementById('tt');
function tipHTML(vis, key) {
  const R = REGV[vis]; if (!R) return '';
  const { v, c } = R;
  const F = c.F;
  if (v.tip && TIPS[v.tip]) return TIPS[v.tip](F, key, c);
  if (v.dtip) return dicaPadrao(v.dtip(c, key));
  const lab = document.querySelector(`[data-pt="${vis}|${key}"]`); return lab ? dicaPadrao([[lab.getAttribute('aria-label'), '']]) : '';
}
const dicaPadrao = (rows) => `<dl class="tt-d">${rows.map(([a, b]) => (b === '' ? `<dt class="tt-h">${esc(a)}</dt>` : `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`)).join('')}</dl>`;
function mostrarTip(el, ev) {
  const [vis, key] = el.dataset.pt.split('|'); const html = tipHTML(vis, key); if (!html) return;
  const t = TT(); t.innerHTML = html; t.hidden = false; t.classList.toggle('pg', html.indexOf('tt-t') >= 0);
  posTip(ev, el);
}
function posTip(ev, el) {
  const t = TT(); if (t.hidden) return;
  let x, y;
  if (ev && ev.clientX !== undefined && ev.type !== 'focusin') { x = ev.clientX + 16; y = ev.clientY + 16; } else { const r = el.getBoundingClientRect(); x = r.right + 8; y = r.top; }
  const w = t.offsetWidth, h = t.offsetHeight;
  if (x + w > window.innerWidth - 8) x = Math.max(8, (ev && ev.clientX ? ev.clientX : x) - w - 16);
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function esconderTip() { const t = TT(); if (t) t.hidden = true; }
let TOASTT = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(TOASTT); TOASTT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  if (MENU && !e.target.closest('.ctxmenu')) fecharMenu(false);
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); executar(a, e); return; }
  const p = e.target.closest('[data-pt]');
  if (p) { const [vis, key] = p.dataset.pt.split('|'); selecionar(vis, key); return; }
  const plot = e.target.closest('[data-plot]');
  if (plot) { if (S.pop && !e.target.closest('.ddpop, .tbpop')) { S.pop = null; render(); return; } const vis = plot.dataset.plot; if (S.sel[S.page] && S.sel[S.page].vis === vis) { S.sel[S.page] = null; render(); } return; }
  if (S.pop && !e.target.closest('.ddpop, .tbpop')) { S.pop = null; render(); }
});
function ajustaDD() { if (CFG.dd && S.dd.lvl === 1 && !DD_OK()) { S.dd.lvl = 0; S.dd.key = null; limparDDSel(); } }
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const k = el.dataset.chg;
  if (k === 'perfil' || k === 'perfilcapa') { S.perfil = el.value; Object.assign(S, PADRAO()); S.dt = null; if (CFG.ficha && S.page === CFG.ficha) S.page = CFG.fichaVolta; }
  else if (k.startsWith('all-f:')) { S.f[k.slice(6)] = null; ajustaDD(); }
  else if (k.startsWith('f:')) { const d = DIMS.find((x) => x.id === k.slice(2)); const all = dimVals(d).map((x) => x.id); const v = +el.value; const cur = S.f[d.id] ? new Set(S.f[d.id]) : new Set(all); if (el.checked) cur.add(v); else cur.delete(v); S.f[d.id] = all.every((x) => cur.has(x)) || !cur.size ? null : cur; for (const e2 of DIMS) if (e2.dep === d.id && S.f[e2.id]) { const ok2 = new Set(dimVals(e2).map((x) => x.id)); const n2 = new Set([...S.f[e2.id]].filter((x) => ok2.has(x))); S.f[e2.id] = n2.size ? n2 : null; } ajustaDD(); }
  render();
});
document.addEventListener('contextmenu', (e) => {
  const p = e.target.closest('[data-pt]'); if (!p) return;
  e.preventDefault(); const [vis, key] = p.dataset.pt.split('|'); abrirMenu(p, vis, key);
});
document.addEventListener('keydown', (e) => {
  const el = document.activeElement;
  if (e.key === 'Escape') {
    if (MENU) { fecharMenu(true); return; }
    if (S.pop) { const p = S.pop; S.pop = null; render(); restaurar({ s: sig({ dataset: { act: 'pop', pop: p } }) }); return; }
    if (!TT().hidden) { esconderTip(); return; }
    if (S.panel && !painelLateral()) { S.panel = false; render(); return; }
    if (S.table) { const v = S.table; S.table = null; render(); const b = document.querySelector(`[data-act="mais"][data-vis="${v}"]`); if (b) b.focus(); return; }
  }
  if (el && el.dataset && el.dataset.pt) {
    const [vis] = el.dataset.pt.split('|');
    if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      e.preventDefault();
      const pts = [...document.querySelectorAll(`[data-pt^="${vis}|"]`)]; const i = pts.indexOf(el);
      let n = e.key === 'Home' ? 0 : e.key === 'End' ? pts.length - 1 : i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1);
      n = Math.max(0, Math.min(pts.length - 1, n));
      pts.forEach((p) => p.setAttribute('tabindex', '-1')); pts[n].setAttribute('tabindex', '0'); pts[n].focus();
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const [v, k] = el.dataset.pt.split('|'); selecionar(v, k); return; }
    if (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey)) { e.preventDefault(); const [v, k] = el.dataset.pt.split('|'); abrirMenu(el, v, k); return; }
  }
  if (e.key === 'Tab' && S.panel && !painelLateral()) { // foco preso no diálogo
    const md = document.querySelector('.md-cx'); if (!md) return;
    const f = [...md.querySelectorAll('button, a, [tabindex="0"]')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
document.addEventListener('mouseover', (e) => { const p = e.target.closest('[data-pt]'); if (p && !MENU) mostrarTip(p, e); });
document.addEventListener('mousemove', (e) => { const p = e.target.closest('[data-pt]'); if (p) posTip(e, p); else esconderTip(); });
document.addEventListener('focusin', (e) => { const p = e.target.closest && e.target.closest('[data-pt]'); if (p && !MENU) mostrarTip(p, { type: 'focusin' }); else if (!e.target.closest || !e.target.closest('#tt')) esconderTip(); });
let RZ = null, ULTFONE = null;
window.addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(() => { const f = isPhone(); if (f !== ULTFONE || !document.getElementById('vp')) { ULTFONE = f; render(); } else escala(); }, 80); });
ULTFONE = isPhone();
render();
</script>
</body>
