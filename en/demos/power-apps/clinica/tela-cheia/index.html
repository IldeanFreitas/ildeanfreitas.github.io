<style>

/* =========================================================
   PONTOS DE QUEBRA

   Media query nao aceita custom property, entao a escala vive aqui como
   documentacao e cada arquivo repete o numero. Sao quatro, e cada um tem uma
   razao:

     430px   diagramas passam a uma coluna
     760px   grades internas de case e detalhe empilham
     940px   navegacao vira menu compacto
     980px   hero e cartao de case passam a duas colunas

   O hero usava 1000px e o cartao de case 980px. Vinte pixels de desacordo
   criavam uma faixa em que um ja era duas colunas e o outro nao. Alinhados
   em 980px.

   Ponto novo deve reusar um destes. Se precisar de outro, acrescente aqui
   com a justificativa -- senao volta a virar cinco numeros sem sistema.
   ========================================================= */

/* =========================================================
   TOKENS — identidade visual YottaFlow
   preto + lime + teal, tipografia Mona Sans, cantos 20px,
   pílulas 9999px e brilho lime nos elementos de destaque
   ========================================================= */
:root{
  /* paleta base */
  --black:#000000;
  --gray-900:#0b0f10;
  --gray-800:#1a1a1a;
  --gray-600:#6b7476;
  --gray-400:#c1c1c1;
  --white:#ffffff;
  --teal:#003438;
  --lime:#a2b700;
  --lime-bright:#c4df00;
  --lime-ink:#0b1200;

  /* papéis */
  --bg:var(--black);
  --bg-alt:var(--gray-900);
  --text:var(--white);
  --text-muted:var(--gray-400);
  --text-dim:#8e9998;
  --accent:var(--lime-bright);
  --accent-solid:var(--lime);
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --border-lime:rgba(162,183,0,.25);
  --surface-card:linear-gradient(180deg,rgba(0,52,56,.30),rgba(0,0,0,.12));
  --surface-soft:rgba(255,255,255,.02);
  --lime-soft:rgba(162,183,0,.08);
  --glow:0 0 40px rgba(162,183,0,.25);
  --grid-line:rgba(255,255,255,.028);

  /* Diagramas. Cores de série da identidade (validadas para daltonismo sobre
     fundo escuro) com papel semântico por zona: fonte azul, ingestão e
     processamento laranja, armazenamento lime, consumo magenta, governança
     teal. O lime brilhante (--accent) fica reservado ao destaque do case. */
  --serie-1:#8b9e0f;
  --serie-2:#009ba0;
  --serie-3:#cf6e37;
  --serie-4:#3778d7;
  --serie-5:#c64998;
  --surface-diagram:#071214;
  --surface-node:#0d1c1f;
  --surface-node-accent:#19281d;
  --diagram-link:#6f7e7d;
  /* Sistema de outra equipe: listra diagonal sutil no fundo do nó. Contorno
     de 1px nas marcas AWS, cujo ladrilho roxo se perde no fundo escuro
     (o SVG do fornecedor fica intacto; o contorno é do <img>). */
  --diagram-stripe:rgba(255,255,255,.05);
  --logo-contorno:rgba(255,255,255,.3);

  /* estados */
  --ok:#9ae86b;        --ok-bg:rgba(122,222,80,.10);
  --warn:#ffcf5c;      --warn-bg:rgba(255,207,92,.10);
  --info:#7fd8e8;      --info-bg:rgba(127,216,232,.10);
  --idle:#b9c2c2;      --idle-bg:rgba(255,255,255,.05);
  /* Laboratório concluído: violeta, fora do verde/âmbar/ciano/cinza dos
     outros selos e fora do vermelho reservado a status crítico. */
  --lab:#c8b6ff;       --lab-bg:rgba(200,182,255,.10);

  /* espaçamento — grade de 4px
     Os valores vêm do que o site já usava em atributos style espalhados. Ao
     conferir, todos caíam na grade (20, 24, 36, 40, 48px) menos um: um gap de
     0.85rem = 13.6px, ajustado para 0.75rem. O defeito não eram os valores,
     era não terem nome nem reuso — sete decisões isoladas que ninguém
     conseguia revisar em conjunto. */
  --space-3:.75rem;    /* 12px */
  --space-4:1rem;      /* 16px */
  --space-5:1.25rem;   /* 20px */
  --space-6:1.5rem;    /* 24px */
  --space-9:2.25rem;   /* 36px */
  --space-10:2.5rem;   /* 40px */
  --space-12:3rem;     /* 48px */

  /* forma */
  --r-pill:9999px;
  --r-card:20px;
  --r-sm:14px;
  --r-xs:10px;         /* linhas de lista dentro de painel (menu de idiomas) */
  --maxw:1200px;

  /* tipografia */
  --font:"Mona Sans","Mona Sans Fallback","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --size-hero:clamp(2.4rem,6vw,5.5rem);
  --size-h2:clamp(1.8rem,4vw,3.2rem);
  --size-h3:clamp(1.15rem,2.4vw,1.6rem);
  --size-sm:clamp(.82rem,.79rem + .12vw,.9rem);
}

[data-theme="light"]{
  --bg:#f4f6f3;
  --bg-alt:#ffffff;
  --text:#0b0f10;
  --text-muted:#41504e;
  --text-dim:#5b6a68;
  --accent:#4a5600;
  --accent-solid:#7f9100;
  --border:rgba(11,15,16,.10);
  --border-strong:rgba(11,15,16,.18);
  --border-lime:rgba(122,140,0,.35);
  --surface-card:linear-gradient(180deg,rgba(0,52,56,.05),rgba(255,255,255,.6));
  --surface-soft:rgba(11,15,16,.02);
  --lime-soft:rgba(162,183,0,.14);
  --glow:0 10px 30px rgba(11,15,16,.10);
  --grid-line:rgba(11,15,16,.035);

  /* Três séries ficam abaixo de 3:1 sobre fundo claro; aqui escurecem até
     passar, mantendo o matiz. Azul e magenta já passavam. */
  --serie-1:#6b7a00;
  --serie-2:#007c80;
  --serie-3:#a8531f;
  --surface-diagram:#ffffff;
  --surface-node:#f5f7f4;
  --surface-node-accent:#eaefd3;
  --diagram-link:#7d8a88;
  --diagram-stripe:rgba(11,15,16,.05);
  --logo-contorno:transparent;

  /* Escurecidos em relacao a versao anterior: os selos de status usam 11px em
     peso 700 sobre um fundo de 10% de alfa, e mediam entre 3.93 e 4.37 contra
     o minimo de 4.5. Texto pequeno nao tem folga. */
  --ok:#1c5410;        --ok-bg:rgba(37,108,20,.10);
  --warn:#614200;      --warn-bg:rgba(122,83,0,.10);
  --info:#094b59;      --info-bg:rgba(13,95,112,.10);
  --idle:#333f3e;      --idle-bg:rgba(11,15,16,.06);
  --lab:#4b2a8c;       --lab-bg:rgba(75,42,140,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 var(--font)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.5rem .9rem;background:var(--bg-alt);border-bottom:1px solid var(--border-strong)}
.barra a,.barra button{color:var(--text);font:inherit}
.voltar{display:inline-flex;align-items:center;min-height:40px;text-decoration:none;font-weight:600;padding:.4rem .9rem;border:1px solid var(--border-strong);border-radius:var(--r-pill)}
.voltar:hover{border-color:var(--accent-solid)}
.nome{font-weight:700;margin-right:auto}
.modos{display:flex;gap:.25rem;border:0;padding:0;margin:0}
.modos legend{position:absolute;left:-9999px}
.modos button,.tela{background:var(--surface-soft);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:.4rem .9rem;cursor:pointer;min-height:40px}
.modos button:hover,.tela:hover{border-color:var(--accent-solid)}
.modos button[aria-pressed="true"]{background:var(--lime-soft);color:var(--accent);border-color:var(--border-lime);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dica{margin:0;padding:.3rem .9rem;color:var(--text-muted);font-size:.8rem;background:var(--bg-alt);border-bottom:1px solid var(--border)}
.palco{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;position:relative;background:var(--bg)}
.caixa{position:relative;background:#fff;overflow:hidden;box-shadow:0 0 0 1px var(--border-strong)}
iframe{border:0;display:block;background:#fff;transform-origin:0 0}
@media (max-width:700px){
  [data-modo="tablet"]{display:none}
  .barra{gap:.35rem;padding:.35rem .5rem;font-size:13px}
  .nome{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .voltar,.modos button,.tela{min-height:32px;padding:.25rem .65rem}
  .voltar{margin-right:auto}
  .dica{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;padding:0;border:0}
}
</style>
</head>
<body>
<div class="barra">
  <a class="voltar" href="/en/demos/power-apps/clinica/">← Back to the app page</a>
  <span class="nome">Clínica Lumevita · Clickable demo</span>
  <fieldset class="modos"><legend>Display format</legend>
    <button type="button" data-modo="tablet" aria-pressed="false">Tablet 16:9</button>
    <button type="button" data-modo="celular" aria-pressed="false">Phone</button>
    <button type="button" data-modo="janela" aria-pressed="false">Fit to window</button>
  </fieldset>
  <button type="button" class="tela" id="tela">Full screen</button>
</div>
<p class="dica" id="dica" aria-live="polite">Simulation of the app opened in a browser. Fictitious data.</p>
<div class="palco" id="palco"><div class="caixa" id="caixa"><iframe id="app" src="/demos/power-apps/clinica/app.html" title="Clickable demo of Clínica Lumevita" allow="fullscreen" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div></div>
<script>
(function () {
  var DICAS = {"janela":"The app fills the whole window, like a responsive app (Scale to fit off).","tablet":"Fixed 16:9 ratio, scaled down to fit, like a tablet app with Scale to fit on.","celular":"Portrait phone ratio with side bars, as in the browser."};
  var TAM = { tablet: [1366, 768], celular: [390, 844] };
  var palco = document.getElementById('palco');
  var caixa = document.getElementById('caixa');
  var app = document.getElementById('app');
  var botoes = document.querySelectorAll('[data-modo]');
  var modo = 'janela';
  function ajustar() {
    var w = palco.clientWidth, h = palco.clientHeight;
    if (modo === 'janela') {
      caixa.style.width = w + 'px'; caixa.style.height = h + 'px';
      app.style.width = w + 'px'; app.style.height = h + 'px'; app.style.transform = 'none';
      return;
    }
    var d = TAM[modo];
    var k = Math.min(w / d[0], h / d[1], 1);
    caixa.style.width = Math.floor(d[0] * k) + 'px'; caixa.style.height = Math.floor(d[1] * k) + 'px';
    app.style.width = d[0] + 'px'; app.style.height = d[1] + 'px';
    app.style.transform = 'scale(' + k + ')';
  }
  function aplicar(m) {
    modo = m;
    botoes.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.modo === m ? 'true' : 'false'); });
    document.getElementById('dica').textContent = DICAS[m];
    ajustar();
  }
  botoes.forEach(function (b) { b.addEventListener('click', function () { aplicar(b.dataset.modo); }); });
  document.getElementById('tela').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (el.requestFullscreen) { el.requestFullscreen().catch(function () {}); }
  });
  var estreito = window.matchMedia('(max-width: 700px)');
  window.addEventListener('resize', function () {
    if (modo === 'tablet' && estreito.matches) aplicar('janela');
    else ajustar();
  });
  aplicar(modo);
})();
</script>
</body>
</html>
