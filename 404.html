<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Ildean Freitas</title>

<style>
:root{--bg:#0b1220;--surface:#131d31;--border:#243450;--text:#e8eef8;--muted:#a9b8d0;--accent:#2dd4bf;--accent-ink:#04211d}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f8fc;--surface:#fff;--border:#d8e0ec;--text:#0e1a2e;--muted:#4b5c76;--accent:#0d7a6f;--accent-ink:#fff}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
  background:var(--bg);color:var(--text);text-align:center;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65
}
main{max-width:34rem}
.code{font-size:clamp(4rem,18vw,8rem);font-weight:800;letter-spacing:-.05em;color:var(--accent);line-height:1;margin:0}
h1{font-size:clamp(1.4rem,4vw,2rem);margin:.4em 0 .3em;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 2rem}
.links{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
a{
  display:inline-block;padding:.75rem 1.3rem;border-radius:8px;text-decoration:none;
  font-weight:700;font-size:.92rem;border:1px solid var(--border);color:var(--text)
}
a.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Esta página não existe</h1>
  <p>O endereço pode ter mudado ou o link estar incorreto. Os cases e a trajetória continuam na página inicial.</p>
  <div class="links">
    <a class="primary" href="/">Ir para o início</a>
    <a href="/#cases">Ver os cases</a>
    <a href="https://github.com/IldeanFreitas" target="_blank" rel="noopener">GitHub</a>
  </div>
</main>
</body>
</html>
